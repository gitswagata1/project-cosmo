apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixing-pool
  namespace: cosmo
  labels:
    app: mixing-pool
    app.kubernetes.io/part-of: project-cosmo
    app.kubernetes.io/component: mixing-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixing-pool
  template:
    metadata:
      labels:
        app: mixing-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        fsGroup: 10003
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cosmo-mixing-pool
      containers:
        - name: mixing-pool
          image: cosmo/mixing-pool:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cosmo-redis
                  key: url
            - name: POOL_SIZE_BYTES
              value: "4096"
            - name: MIX_INTERVAL_S
              value: "1.0"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosmo-mixing-pool
  namespace: cosmo
