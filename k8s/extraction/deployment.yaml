apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction
  namespace: cosmo
  labels:
    app: extraction
    app.kubernetes.io/part-of: project-cosmo
    app.kubernetes.io/component: extraction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: extraction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: extraction
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cosmo-extraction
      containers:
        - name: extraction
          image: cosmo/extraction:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cosmo-redis
                  key: url
            - name: BATCH_SIZE
              value: "1024"
            - name: MIN_ENTROPY_THRESHOLD
              value: "0.5"
            - name: SECURITY_PARAM_BITS
              value: "128"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: extraction
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosmo-extraction
  namespace: cosmo
