apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: cosmo
  labels:
    app: ingestion
    app.kubernetes.io/part-of: project-cosmo
spec:
  selector:
    app: ingestion
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
