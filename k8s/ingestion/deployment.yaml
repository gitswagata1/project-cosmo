apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: cosmo
  labels:
    app: ingestion
    app.kubernetes.io/part-of: project-cosmo
    app.kubernetes.io/component: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cosmo-ingestion
      containers:
        - name: ingestion
          image: cosmo/ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cosmo-redis
                  key: url
            - name: MQTT_BROKER
              valueFrom:
                configMapKeyRef:
                  name: cosmo-config
                  key: mqtt-broker
            - name: MQTT_PORT
              valueFrom:
                configMapKeyRef:
                  name: cosmo-config
                  key: mqtt-port
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ingestion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosmo-ingestion
  namespace: cosmo
  annotations:
    iam.gke.io/gcp-service-account: cosmo-ingestion@PROJECT_ID.iam.gserviceaccount.com
