kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: cosmo
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: project-cosmo
      ports:
        - port: 6379
          protocol: TCP
